<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerca (provisional) · Descubre negocios locales</title>
<meta name="description" content="Prototipo de plataforma para descubrir negocios locales. Datos de demostración.">
<script>/* aplica el tema antes de pintar para evitar un destello */(function(){var t;try{t=localStorage.getItem('cerca.theme')}catch(e){}if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16302B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Cerca, nombre provisional. Ir al inicio">
    <svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true" focusable="false"><circle cx="17" cy="17" r="17" fill="#F2A33A"/><path d="M17 8c-4.4 0-7.5 3.2-7.5 7.2 0 5 5.7 9.6 7.5 11.3 1.8-1.7 7.5-6.3 7.5-11.3C24.5 11.2 21.4 8 17 8Z" fill="#16302B"/><circle cx="14.2" cy="15" r="1.4" fill="#fff"/><circle cx="19.8" cy="15" r="1.4" fill="#fff"/></svg>
    <span>Cerca</span>
  </a>
  <button type="button" class="btn btn--ghost btn--icon" id="theme-toggle" aria-pressed="false" aria-label="Modo oscuro">
    <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5Z"/></svg>
    <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <p class="pill-demo">Datos de demostración, no son negocios reales</p>
</header>

<div id="view-home">
  <section class="hero">
    <div class="hero-main">
      <h1>Lo que necesitas, a pocas cuadras</h1>
      <form id="search-form" role="search" class="search">
        <label for="q" class="sr-only">Buscar negocios</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Busca pan, copias, almuerzo…">
      </form>
      <div class="chips" id="chips" role="group" aria-label="Filtros"></div>
    </div>
  </section>

  <div class="viewtoggle" role="group" aria-label="Ver como">
    <button type="button" id="pane-list" aria-pressed="true">Lista</button>
    <button type="button" id="pane-map" aria-pressed="false">Mapa</button>
  </div>

  <main id="main" class="discover" data-pane="list">
    <section class="panel" aria-label="Resultados">
      <p class="count" id="count" aria-live="polite"></p>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden>
        <p class="empty-title">Sin resultados</p>
        <p id="empty-text"></p>
      </div>
    </section>
    <section class="mapwrap" aria-label="Mapa de negocios">
      <div class="map" id="map" data-map="loading"></div>
      <button type="button" class="map-home" id="map-home" aria-label="Volver a Roldanillo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span id="map-home-label">Roldanillo</span></button>
      <p class="map-status" id="map-status" role="status" hidden></p>
      <article class="selcard" id="selcard" hidden aria-live="polite"></article>
    </section>
  </main>
</div>

<div id="view-profile" hidden><main class="profile" id="profile"></main></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>/* PWA: registra el service worker si el navegador lo admite (solo https o localhost) */if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
